# Briefing look: warm paper page, white cards, navy controls. Light only: every chart is styled for it.
[theme]
base = "light"
primaryColor = "#1F3A5F"
backgroundColor = "#F7F6F2"
secondaryBackgroundColor = "#EFEDE6"
textColor = "#16181D"
linkColor = "#1F3A5F"
borderColor = "#E1E0D9"
showWidgetBorder = true
baseRadius = "0.6rem"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap, sans-serif"
headingFont = "Source Serif 4:https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap, serif"
headingFontWeights = [700, 700, 600, 600, 600, 600]

# Sidebar: the navy cover band of the briefing, so the controls read as part of the document.
[theme.sidebar]
backgroundColor = "#1F3A5F"
secondaryBackgroundColor = "#2A4A73"
textColor = "#F3F1EA"
primaryColor = "#A9C6EA"
linkColor = "#CFE0F5"
borderColor = "#3D5D86"

[client]
toolbarMode = "viewer"

[browser]
gatherUsageStats = false
